name: Stable Release

on:
  push:
    branches: [ main ]
    paths:
      - "module.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Version
        id: read
        run: |
          VERSION=$(jq -r '.version' module.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Preparing stable release for v$VERSION"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git fetch --tags

      # Without this, module.json on main keeps whatever download URL beta
      # last set — a beta zip, with a beta tag, often with a trailing build
      # number release-merge.yml never strips. Foundry's updater reads this
      # field straight from the manifest, so a stale value here means a 404
      # the moment anyone updates, not a cosmetic mismatch.
      - name: Update download URL
        id: update
        run: |
          VERSION="${{ steps.read.outputs.version }}"
          NEW_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/Runes-and-Remnants-v${VERSION}.zip"
          jq --arg url "$NEW_URL" '.download = $url' module.json > tmp.json && mv tmp.json module.json
          echo "Updated download URL: $NEW_URL"

      - name: Commit updated module.json
        run: |
          git add module.json
          git commit -m "chore: update stable download URL for v${{ steps.read.outputs.version }}" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Tag & Push
        id: tag
        run: |
          TAG="v${{ steps.read.outputs.version }}"
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists, skipping."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Creating new stable tag: $TAG"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Stop if no new tag
        if: steps.tag.outputs.should_release == 'false'
        run: exit 0

      - name: Build ZIP
        id: build
        run: |
          NAME="Runes-and-Remnants-v${{ steps.read.outputs.version }}.zip"
          # An allowlist, not a blocklist. Name what Foundry loads and nothing
          # else, so a new dev file cannot leak into a release by default —
          # which is how docs/, test-results/, .agents/, both test configs and
          # fourteen *Details.md files ended up in user downloads.
          zip -r "$NAME" \
            module.json index.js LICENSE \
            src styles templates packs \
            -x "*Details.md" "*Breakdown.md" "*.psd" "*.ai" "*.blend" ".DS_Store" \
               "packs/*/LOCK" "packs/*/LOG" "packs/*/LOG.old"
          echo "zip_name=$NAME" >> $GITHUB_OUTPUT

      - name: Show what shipped
        run: unzip -l "${{ steps.build.outputs.zip_name }}"

      - name: Publish Stable Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Runes & Remnants v${{ steps.read.outputs.version }}"
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.zip_name }}
            module.json
